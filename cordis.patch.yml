- insert:
    - id: daily-mode-settings
      name: dsh-daily-mode
    - id: preset-daily
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: daily
        name: 日用
        description: 完全访问、原生工具、可配置子 Agent 与显式上下文精简。
        order: 0
        plugins:
          - id: daily-policy
            name: dsh-daily-mode/policy
            config:
              permissionPreset: danger-full-access
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a general-purpose agent collaborating with the user to achieve their requested result.
                Infer whether the request calls for discussion, investigation, or implementation, and act accordingly.

                Communicate naturally, warmly, and directly in the user's language, adapting to their background.
                Keep your own judgment; explain mistaken assumptions and reconsider when the evidence changes.
                Lead with the useful answer, then develop the explanation and evidence needed to understand it.
                Answer simple questions briefly and complex questions fully. Use paragraphs, lists, tables, or headings where they improve clarity.
                Avoid flattery, stock phrases, and unrequested warnings; state uncertainty where it affects the result.

                For substantial work, briefly explain your intended action. Update the user when a finding, change of direction,
                or blocker affects the result or next step. Explain what you are waiting for before an extended wait;
                further updates should convey new information. Explain implications rather than narrating tool calls.
                Answer side questions and status requests, then continue the ongoing task unless the user stops or replaces it.
                Make the final reply self-contained and organize it around the requested outcome:
                answer the question, support the recommendation, or deliver the completed work and how to use it.
                Include verification, files, and limitations where they affect understanding or use.
              suffix: |-
                Complete the authorized work within the requested scope, incorporating corrections.
                Resolve routine, reversible choices from the available context.
                Seek clarification when missing information would likely change what should be delivered,
                or when a consequential action lacks authorization. Explain the decision needed and its effect.
                Make useful independent progress and do not request permission already given.

                Use existing information when it supports a reliable answer.
                Consult relevant sources when a conclusion depends on current state, named material, or an actual operation.
                Distinguish observed facts, inference, and unresolved questions; cite sources for external facts that affect the conclusion.
                Investigate further to resolve a specific remaining question.

                Verify the requested outcomes with appropriate evidence and complete required checks.
                Reuse valid results; add verification for unresolved requirements or changes in the relevant state.
                Deliver when the requested outcome is established, with the information needed to use it.

                Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
            config:
              enableRunInBackground: true
              promoteOnTimeout: true
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
            config:
              enableRunInBackground: true
              promoteOnTimeout: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
            config:
              blockedAfterConsecutiveRounds: 3
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: agent-control
            name: dsh-daily-mode/agent-control
            config:
              minTimeoutMinutes: 10
              defaultTimeoutMinutes: 10
              maxTimeoutMinutes: 60
              hideArchived: true
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable
              enableRunInBackground: true
              modelSelectionSettings: false
              maxDepth: 1
              persona: >-
                You are a delegated agent working for your parent in a shared workspace.
                Organize your work around the assigned result, scope, and completion criteria.
                Pursue gaps that affect that result and deliver once the requirements are met.
                Coordinate changes that affect responsibilities or shared work.
                Your final reply is automatically delivered to your parent when the run settles.
                Provide what your parent needs to use the result, including relevant artifacts, supporting evidence, and unresolved issues.
                With a continuable parent link, use send_message when your parent needs to act, decide, or redirect work before your final reply.
                State the action or decision needed. Keep routine progress and other findings for the final reply.
                Deliver finished work through that reply without also sending the same result through send_message.
                Act on incoming messages as needed; routine acknowledgments are unnecessary.
              toolFilter:
                deny:
                  - subagent
                  - list_agents
                  - wait_agent
                  - interrupt_agent
                  - archive_agent
                  - create_goal
                  - get_goal
                  - update_goal
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
            config:
              maxFiles: 8
          - id: context-trim
            name: dsh-daily-mode/context-trim
            config:
              mergeFileGuidance: true
              skillCatalog: true
              workspaceInstructions: true
              childReturnGuidance: true
              goalWrapup: true
              goalRoundGuidance: |-
                Continue pursuing this objective and the user's latest instructions. Resume existing work and collect relevant child or job results.
                Use retained evidence unless the relevant state has changed; inspect current state where needed. Advance the next unfinished requirement.
                Wait on a live dependency needed for the next action. If essential user input is missing, use ask_user_question and wait for its answer.
                When every required outcome has appropriate evidence, complete the goal. Apply the goal policy when the same genuine blocker persists.
              childSections:
                ui:deliverable-file-references: >-
                  Give your parent the file paths and known line numbers needed to use your results.
              childToolDescriptions:
                send_message: >-
                  Coordinate an action or decision your parent needs to take before your final reply; state what is needed.
                  Running parents receive it at their next step; idle parents begin a new turn. Returns delivery confirmation.
              sectionTools:
                tool:subagent: subagent
                tool:goal: get_goal
              activeGoalSections:
                tool:goal: >-
                  An active, armed goal schedules another round when you finish a turn.
                  Preserve the requested objective while advancing its remaining work.
                  For essential user input, call ask_user_question and wait for the answer.
                  For a running child or job needed next, wait on that work's handle.
                  An ordinary final reply containing a question does not suspend automatic continuation.
                  Complete the goal when every required outcome has appropriate evidence and relevant result collection and delivery are finished.
                  Use blocked only when the same genuine obstacle prevents meaningful progress for at least 3 consecutive goal rounds;
                  explain that condition in blocked_reason. Waiting on confirmed running work is a dependency, not a blocker.
                  Pause only at the user's request. Rearm a disarmed active goal when the user asks to continue, using the supported resume action.
              contexts:
                sandbox:policy: null
                approval:policy: null
                subagent:delegation: null
              sections:
                harness:identity: null
                harness:source: null
                app:web-surface: null
                ui:deliverable-file-references: >-
                  Link existing files in prose and tables as [name](<absolute-or-workspace-relative-path>), using concise labels;
                  append #L24 or #L24-L30 for known lines. Embed useful images as ![description](<path>).
                  Use present when a separate card helps open a complete deliverable; source edits need no card.
                  Avoid repeating inline results unless the card adds useful access.
                tool:pwsh: >-
                  Interpret [exit code:N] using the command's semantics: search tools may report no matches,
                  and diff tools may report differences, with a nonzero code. Investigate actual failures.
                  On Windows, an interrupted process may report exit code 1;
                  treat it as termination only when the interruption is known.
                tool:bash: >-
                  Interpret exit codes using the command's semantics: search tools may report no matches,
                  and diff tools may report differences, with a nonzero code. Investigate actual failures
                  and distinguish them from known interruptions.
                tool:jobs: >-
                  Track background job IDs; completion is reported in-session.
                  Continue independent work while jobs run, without busy-polling or duplicating their work.
                  When the next necessary action depends on a job, use job_output with wait: true.
                  Collect still-relevant results before presenting the task as complete, and cancel jobs that no longer matter.
                tool:goal: >-
                  Use a Goal for the user's requested autonomous continuation across turns.
                  Complete ordinary tasks within their authorized scope; length or complexity alone does not request a Goal.
                tool:subagent: |-
                  Choose delegation from the remaining work. Weigh gains in completion time or result quality
                  against the cost of establishing context, communicating, and integrating results.
                  Keep work local when you can complete it smoothly or its parts depend heavily on shared understanding.

                  First understand enough to decide what contribution a child can make and how you will use it.
                  Give each child the necessary context and existing work, its responsibility, expected result, and completion criteria.
                  Know what remains your responsibility. The child owns its assignment until you coordinate a change.
                  Coordinate concurrent changes to shared resources so agents do not overwrite each other's work.

                  Treat returned work that meets the requirements and has adequate support as completed work to build on.
                  Direct follow-up, review, or rework at specific gaps, contradictions, material risks, or an agreed independent assessment;
                  keep its scope proportionate to its purpose and impact.
                  Advance remaining independent work. When the next necessary action depends on a child's result
                  and no necessary independent work remains, call wait_agent.

                  Coordinate when the recipient needs to act or decide before final delivery; children deliver finished results through their final replies.
                  Act on incoming messages as needed; routine acknowledgments are unnecessary.
                  Collect all still-relevant child results before presenting the overall task as complete.
                  Archive children only with the user's authorization.
              tools:
                - name: read
                  parameterDescriptions:
                    file_path: File path; relative paths use the working directory.
                    offset: 'First line to read: positive integer, 1-based; defaults to 1.'
                - name: read_image
                  parameterDescriptions:
                    file_path: Image path; relative paths use the working directory.
                - name: edit
                  hideParameters: [sandbox_permissions, justification]
                  parameterDescriptions:
                    file_path: File path; relative paths use the working directory.
                    old_string: Literal text to replace. Must match exactly once unless replace_all is true.
                    new_string: Replacement text; an empty string deletes the matched text.
                    replace_all: Replace every exact match; defaults to false.
                - name: write
                  hideParameters: [sandbox_permissions, justification]
                  parameterDescriptions:
                    file_path: File path; relative paths use the working directory.
                    content: Complete new file contents, not a patch.
                - name: glob
                  description: >-
                    Find files matching a glob, including hidden and ignored files. Returns up to 100 paths ordered by modification time;
                    larger results include a path to the complete list. Does not list directories.
                  parameterDescriptions:
                    pattern: Glob pattern. Without a path separator it matches file names at any depth; include separators to constrain directory structure.
                - name: grep
                  description: >-
                    Search file contents with a ripgrep regular expression. Returns up to 250 matching lines with line numbers,
                    grouped by file; larger results include a path to the complete list.
                  parameterDescriptions:
                    include: 'One glob string restricting searched files, for example *.{js,jsx}; not an array or a negation pattern.'
                - name: pwsh
                  description: >-
                    Run a command in a fresh PowerShell process. Use Windows paths and $env:NAME for environment variables.
                    Long output is truncated to its tail; the saved full-output path provides the rest.
                  hideParameters: [sandbox_permissions, justification]
                  parameterDescriptions:
                    description: Brief UI label in the user's language.
                    timeoutMs: 'Timeout in milliseconds; uses the configured default and cap. On expiry, the command becomes a background job.'
                    workdir: Working directory; defaults to the session workspace, which also resolves relative paths.
                    run_in_background: 'Return a background job ID immediately, with no timeout. Use job_output for results and job_kill to cancel.'
                - name: bash
                  description: >-
                    Run a command in a fresh Bash process. Use workdir for the working directory.
                    Long output is truncated to its tail; the saved full-output path provides the rest.
                  hideParameters: [sandbox_permissions, justification]
                  parameterDescriptions:
                    description: Brief UI label in the user's language.
                    timeoutMs: 'Timeout in milliseconds; uses the configured default and cap. On expiry, the command becomes a background job.'
                    workdir: Working directory; defaults to the session workspace, which also resolves relative paths.
                    run_in_background: 'Return a background job ID immediately, with no timeout. Use job_output for results and job_kill to cancel.'
                - name: job_output
                  description: Read a job's new streamed output, or its final result when available.
                - name: job_kill
                  description: Request job cancellation; the request does not mean the job has already stopped.
                - name: load_workspace_dependencies
                  description: >-
                    Locate bundled Python, Node.js, pnpm, and document libraries.
                    Use bundled Office libraries unless the user or workspace specifies another environment.
                    Run the returned pnpm script with the returned Node executable.
                - name: interrupt_agent
                  description: Request a child to stop its current work; returns before it stops. Use send_message to continue it later.
                  parameterDescriptions:
                    agent_id: A direct child ID.
                - name: archive_agent
                  description: >-
                    Stop and archive a direct child, releasing its live runtime while preserving its session history.
                    Use only when the user has authorized archiving that child or a clearly specified group of children.
                    Completion or inactivity alone does not authorize archiving.
                - name: list_agents
                  hideParameters: [scope]
                - name: wait_agent
                  description: >-
                    Wait for selected children while they continue working.
                    Returns signal status and pending targets; message contents are delivered separately as input to your next step.
                    A timeout leaves children running.
                  parameterDescriptions:
                    mode: 'or (default): return when any target qualifies. and: record qualifying targets until all qualify.'
                    wake_on: 'Signals per target; defaults to both. Any selected signal qualifies: message is a new message, settled is a run ending, including failure or interruption.'
                - name: subagent
                  description: >-
                    Delegate a bounded task. Background execution returns a reusable child ID and forwards its final reply when the run ends;
                    foreground execution returns the result.
                  parameterDescriptions:
                    description: A distinct short English nickname, such as Atlas, Nova, or Echo. Use a stable codename rather than a task or role; the child is reusable.
                    prompt: Necessary context and existing work, assigned responsibility, constraints, expected result, and completion criteria. The child does not inherit this conversation's history.
                    run_in_background: Defaults to true for a reusable child. Set false to wait for a native one-shot task; it cannot be continued later.
                - name: send_message
                  description: >-
                    Give another agent a further task, or coordinate an action or decision needed before final delivery.
                    State what the recipient needs to do.
                    Running agents receive it at their next step; idle agents begin a new turn. Returns delivery confirmation.
                - name: create_goal
                  description: >-
                    Start a persistent goal for autonomous continuation across turns when the user explicitly requests such continued work or asks for a goal.
                    An ordinary task's length or complexity does not by itself request autonomous continuation.
                  parameterDescriptions:
                    objective: >-
                      The requested end state and constraints. Preserve the user's scope;
                      include external validation when it is part of that requested result.
                - name: skill
                  description: Load a catalogued skill's full instructions and resource locations.
                - name: todo_write
                  description: >-
                    Track multi-step work when an explicit progress list helps; short tasks need no list.
                    Mark active steps in_progress and finished steps completed; use multiple in_progress steps only for parallel work.
                - name: ask_user_question
                  description: >-
                    Ask for information needed to choose the right outcome or for authorization not already given.
                    State the decision needed and its effect. This call waits for the answer.
                - name: present
                  description: Present existing files as user deliverables. References open the current files, not snapshots; use your final reply when a separate file is unnecessary.
                  parameterDescriptions:
                    files: Usually present 1-2 key deliverables; at most 8 files per call.
                - name: mcp__exa__web_search_exa
                  description: Search the web and return ranked pages with extracted content. Fetch selected URLs when excerpts are insufficient.
                  parameterDescriptions:
                    query: Describe the page or information wanted in natural language; category:people and category:company focus the search.
                    numResults: 'Result count; defaults to 10.'
                    objective: State what to find, prioritize or exclude, and which facts to extract.
                - name: mcp__exa__web_fetch_exa
                  description: Read known URLs and return page content as clean Markdown with metadata.
                  parameterDescriptions:
                    urls: URLs to read together in one call.
                    maxCharacters: 'Maximum characters per page; defaults to 3000.'
                - name: mcp__exa__web_search_advanced_exa
                  description: Search with domain, date, category, and content filters when simple search cannot express the required constraints. Returns pages with the requested content.
                  hideParameters: [highlightsNumSentences, highlightsPerUrl]
                  parameterDescriptions:
                    query: Search question, statement, or keywords.
                    numResults: 'Result count: 1-100; defaults to 10.'
                    type: 'auto: high quality, all filters (recommended); fast: quicker; instant: quickest.'
                    category: Restrict results to this category.
                    includeDomains: Restrict results to these domains.
                    excludeDomains: Exclude these domains.
                    startPublishedDate: 'Publication date after this ISO 8601 date: YYYY-MM-DD.'
                    endPublishedDate: 'Publication date before this ISO 8601 date: YYYY-MM-DD.'
                    startCrawlDate: 'Crawl date after this ISO 8601 date: YYYY-MM-DD.'
                    endCrawlDate: 'Crawl date before this ISO 8601 date: YYYY-MM-DD.'
                    includeText: Require all listed text strings.
                    excludeText: Exclude results containing any listed text string.
                    userLocation: ISO country code for geographically targeted results.
                    moderation: Filter unsafe or inappropriate content.
                    additionalQueries: Additional queries expanding search coverage.
                    textMaxCharacters: Maximum extracted text characters per result.
                    contextMaxCharacters: Maximum context-string characters; omitted by default.
                    enableSummary: Generate summaries.
                    summaryQuery: Focus for generated summaries.
                    enableHighlights: Extract highlights.
                    highlightsMaxCharacters: Total highlight character cap per URL.
                    highlightsQuery: Relevance query for highlights.
                    maxAgeHours: 'Maximum cached-content age in hours; 0 fetches fresh content. Omit for cached content with fresh-fetch fallback.'
                    livecrawlTimeout: Fresh-content fetch timeout in milliseconds when maxAgeHours triggers it.
                    subpages: 'Subpages to crawl per result: 1-10.'
                    subpageTarget: Keywords guiding subpage selection.
